name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blog_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: blog_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      SECRET_KEY: ci-test-secret-key-for-automated-validation-only-123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code formatting check (Ruff)
        run: ruff format --check .

      - name: Code linting check (Ruff)
        run: ruff check .

      - name: Check for ungenerated model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite with coverage
        run: pytest --cov --cov-fail-under=85

      - name: Validate OpenAPI 3 Schema
        run: python manage.py spectacular --validate --fail-on-warn

      - name: Production deployment check
        run: DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py check --deploy
